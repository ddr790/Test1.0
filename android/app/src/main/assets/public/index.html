async function generateImage(){const p=($('#img-prompt')?.value||'').trim();if(!p)return toast('Descreva a imagem primeiro');if(S.imageBusy)return;S.imageBusy=1;draw(1);try{const cfg=window.ATLAS_IMAGE_CONFIG||{};const key=cfg.apiKey||'';const model=cfg.model||'gemini-3.1-flash-image';if(!key)throw new Error('missing-key');const style=S.imageStyle&&S.imageStyle!='Natural'?` Estilo: ${S.imageStyle}.`:'';const extras=` Proporção solicitada: ${S.imageRatio}.${S.imageExpand?' Expanda a composição para preencher a proporção solicitada.':''}${S.imageImprove?' Melhore nitidez, iluminação, detalhes e acabamento.':''}`;const input=[{type:'text',text:p+style+extras}];for(const ref of (S.imageRefs||[])){const m=String(ref).match(/^data:([^;]+);base64,(.*)$/);if(m)input.push({type:'image',mime_type:m[1],data:m[2]})}const r=await fetch('https://generativelanguage.googleapis.com/v1beta/interactions',{method:'POST',headers:{'x-goog-api-key':key,'Content-Type':'application/json'},body:JSON.stringify({model,input,response_format:{type:'image',mime_type:'image/png',aspect_ratio:S.imageRatio}})});const raw=await r.text();let data={};try{data=JSON.parse(raw)}catch(e){}if(!r.ok){const msg=data?.error?.message||`HTTP ${r.status}`;throw new Error(msg)}const b64=data?.output_image?.data||data?.interaction?.output_image?.data||data?.outputImage?.data||'';if(!b64)throw new Error('no-image');S.imageResult='data:image/png;base64,'+b64;save();toast('Imagem gerada pelo ATLAS Image')}catch(e){console.error('ATLAS image generation:',e);toast(e.message?.includes('401')||e.message?.includes('403')?'A chave da geração de imagens foi recusada. Verifique a chave no Google AI Studio.':'Não foi possível gerar a imagem agora.')}finally{S.imageBusy=0;draw(1)}}

async function readWebPage(){const input=$('#web-url'),status=$('#web-status');const url=(input?.value||'').trim();if(!/^https?:\/\//i.test(url))return status&&(status.textContent='Digite um link completo começando por https://');S.webBusy=1;if(status)status.textContent='Abrindo a página e lendo o conteúdo...';try{const target='https://r.jina.ai/http://'+url.replace(/^https?:\/\//i,'');const r=await fetch(target);if(!r.ok)throw new Error('HTTP '+r.status);const text=(await r.text()).slice(0,60000);if(!text.trim())throw new Error('empty');S.webUrl=url;S.att=[{n:new URL(url).hostname+' — página da Web',txt:text}];S.attachOpen=0;$('#sh')?.remove();S.v=S.cid?'chat':'home';draw(1);toast('Página lida. Faça uma pergunta sobre ela.')}catch(e){if(status)status.textContent='Não consegui ler esta página. Verifique o link e tente novamente.'}finally{S.webBusy=0}}

function parseNaturalDate(t){const now=new Date(),x=t.toLowerCase();let d=new Date(now);if(/depois de amanhã|depois de amanha/.test(x))d.setDate(d.getDate()+2);else if(/amanhã|amanha/.test(x))d.setDate(d.getDate()+1);else if(!/hoje/.test(x)){const m=x.match(/(?:dia|em)\s+(\d{1,2})(?:\s+de\s+([a-zç]+))?/);if(m){const mo={janeiro:0,fevereiro:1,março:2,abril:3,maio:4,junho:5,julho:6,agosto:7,setembro:8,outubro:9,novembro:10,dezembro:11};d.setDate(+m[1]);if(m[2]&&mo[m[2]]!=null)d.setMonth(mo[m[2]]);if(d<now)d.setFullYear(d.getFullYear()+1)}}return d}
function parseTime(t){const m=t.match(/(?:às|as)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i)||t.match(/\b(\d{1,2}):(\d{2})\b/);if(!m)return null;let h=+m[1],n=+(m[2]||0);if(m[3]?.toLowerCase()==='pm'&&h<12)h+=12;if(m[3]?.toLowerCase()==='am'&&h===12)h=0;return ('0'+h).slice(-2)+':'+('0'+n).slice(-2)}

function scheduleFromChat(t){const x=t.toLowerCase();if(!/(amanhã|amanha|hoje|dia\s+\d|às\s+\d|as\s+\d|me lembre|me avise|agende|agenda|compromisso|reunião|reuniao|evento|marque)/.test(x))return false;const q=eventTitle(t).toLowerCase();if(/\b(cancelar|cancele|excluir|exclua|apagar|apague)\b/.test(x)){const i=S.events.findIndex(e=>e.title.toLowerCase().includes(q)||q.includes(e.title.toLowerCase()));if(i>=0){S.events.splice(i,1);save();toast('Compromisso removido');return true}}const d=parseNaturalDate(t),e=addEvent(eventTitle(t),d.toISOString().slice(0,10),parseTime(t)||'09:00',t);return !!e}

function listen(){if(S.v!='call')return;if(S.mute)return setC('mute','Microfone desligado');if(!SR)return setC('err','Reconhecimento de voz indisponível neste navegador');

r.onresult=e=>{S.cap=[...e.results].map(a=>a[0].transcript).join('');capUp();if(e.results[e.results.length-1].isFinal){S.cs='think';r.stop();reply(S.cap)}};

r.onend=()=>{if(S.v=='call'&&S.cs=='listen'&&!S.mute)setTimeout(listen,300)};r.start()}catch(e){setC('err','Não foi possível usar o microfone')}}

let SAMPLE=null;
const SYS=`Você é o Atlas, um assistente virtual de inteligência artificial ultra-avançado, inspirado no Dola AI, mas com capacidades expandidas de análise profunda, planejamento estratégico e mentoria de produtividade.

Sua missão é atuar como um secretário executivo e tutor inteligente. Suas capacidades principais são:

1. GERENCIAMENTO DE ROTINA (Estilo Dola): Sempre que o usuário enviar mensagens sobre tarefas, compromissos ou horários bagunçados, processe e organize tudo em uma agenda limpa, identificando a data, hora e prioridade de forma automática.
2. RESUMOS EXECUTIVOS: Capacidade de ler textos longos e extrair pontos de ação imediatos (Action Items).
3. MENTORIA DE PRODUTIVIDADE (O "Algo a Mais"): Não apenas organize as tarefas, mas sugira técnicas de produtividade (como Pomodoro ou blocos de tempo) e avise se o usuário estiver sobrecarregando o dia.
4. ESTUDOS AVANÇADOS: Explique conceitos difíceis criando analogias simples, mapas mentais textuais e gerando mini-quizzes para testar o conhecimento do usuário.

DIRETRIZES DE RESPOSTA:
- Idioma: Português (Brasil).
- Tom: Extremamente prestativo, inteligente, organizado e proativo.
- Formatação: Use negritos nas palavras-chave e organize tudo em tópicos curtos (bullet points) para leitura rápida.`;
const MODE_P={'Rápido':'Responda de forma curta e direta.','Pro':'Modo Pro: use respostas mais completas, raciocínio aprofundado e maior cuidado com tarefas complexas.','Criação por IA':'Modo Criação: crie conteúdo original (ideias, textos, roteiros, nomes, planos) já pronto para usar.','Escrever':'Modo Escrever: ajude a redigir ou melhorar textos; entregue a versão final e depois notas breves de ajuste.','Dever de casa':'Modo Dever de casa: aja como tutor, explique passo a passo com analogias, mapa mental textual e termine com um mini-quiz de 3 perguntas.','Editar imagem':'Modo Editar imagem: você não gera imagens; analise a imagem anexada e dê instruções precisas de edição.','Traduzir':'Modo Traduzir: traduza o texto do usuário (português para inglês; outros idiomas para português) e explique nuances em 1 ou 2 linhas.','Ler':'Modo Ler: resuma o texto ou arquivo anexado em resumo executivo com Action Items.'};

function build(hist){const now=new Date().toLocaleString('pt-BR',{dateStyle:'full',timeStyle:'short'});let s=SYS+`\n\nContexto do app: hoje é ${now}. Você está dentro do app ATLAS e tem as ferramentas criar_tarefa, listar_tarefas e lembrar (use criar_tarefa sempre que o usuário pedir lembrete, tarefa ou compromisso com horário). Você NÃO acessa e-mail, agenda externa nem internet: se precisar, peça que o usuário cole o conteúdo. Modo atual: ${S.mode}. ${MODE_P[S.mode]||''}`;
if(S.v=='call')s+='\nVocê está em chamada de voz: responda em no máximo 3 frases curtas, sem markdown, como texto falado.';
if(S.set.mem&&S.mem.length)s+='\nMemórias sobre o usuário:\n'+S.mem.map(x=>'- '+x).join('\n');
let h=[];hist.filter(m=>!m.err&&(m.c||m.t)).slice(-24).forEach(m=>{const r=m.r=='u'?'user':'assistant',c=m.r=='u'?(m.c||m.t):m.t;if(h.length&&h[h.length-1].role==r)h[h.length-1].content+='\n\n'+c;else h.push({role:r,content:c})});
while(h.length&&h[0].role!='user')h.shift();while(h.length&&h[h.length-1].role!='user')h.pop();

function runAtlasAutomation(t){
  const x=t.trim();
  let m;
  // Reminders: “me lembre ... às HH:MM”
  m=x.match(/(?:me\s+)?lembre(?:-me)?(?:\s+de)?\s+(.+?)\s+(?:às|as)\s+(\d{1,2})(?::(\d{2}))?/i);
  if(m){addTask(m[1].trim(),String(m[2]).padStart(2,'0')+':'+String(m[3]||'00').padStart(2,'0'),'Uma vez');return true}
  // Daily reminders
  m=x.match(/(?:todo\s+dia|diariamente).+?\s+(?:às|as)\s+(\d{1,2})(?::(\d{2}))?/i);
  if(m){addTask(x.replace(/.*?(?:todo\s+dia|diariamente)\s*/i,'').replace(/\s+(?:às|as)\s+\d{1,2}(?::\d{2})?.*$/i,'').trim()||'Tarefa diária',String(m[1]).padStart(2,'0')+':'+String(m[2]||'00').padStart(2,'0'),'Diária');return true}
  // Open URLs / common apps
  m=x.match(/^(?:abra|abrir|open)\s+(.+)$/i);
  if(m && /^(https?:\/\/|www\.|google|youtube|maps|gmail)/i.test(m[1])){let u=m[1].trim();if(!/^https?:\/\//i.test(u)){const q=encodeURIComponent(u);u=/^(google|youtube|maps|gmail)$/i.test(u)?({google:'https://www.google.com',youtube:'https://www.youtube.com',maps:'https://maps.google.com',gmail:'https://mail.google.com'}[u]):'https://www.google.com/search?q='+q}if(window.ATLASNative?.openUrl)ATLASNative.openUrl(u);else location.href=u;toast('Abrindo');return true}
  // Message action
  m=x.match(/(?:envie|enviar|mande|mandar)\s+(?:uma\s+)?mensagem\s+(?:para|pra)\s+([+\d\s()-]{6,})\s+(?:dizendo|com)\s+(.+)/i);
  if(m){atlasMessage(m[1].trim(),m[2].trim());return true}
  // Explicit create event shortcut delegates to agenda parser
  if(/^(?:crie|criar|agende)\s+(?:um\s+)?(?:evento|compromisso)\b/i.test(x)){return scheduleFromChat(x)}
  return false;
}

function finishAuth(u){if(!u)return;S.in=1;S.em=0;S.authBusy=false;S.authInitializing=false;S.authError='';S.authOk='';if(u.displayName&&!S.name)S.name=u.displayName;save();if(S.v==='login')go('home');else draw();}
async function signIn(p){
const email=p==='email'?($('#auth-email')?.value||'').trim().toLowerCase():'';
const password=p==='email'?($('#auth-password')?.value||''):'';
if(p==='email')S.authEmail=email;
if(!window.FB){S.authError='O Firebase não está disponível neste ambiente.';draw();return}
if(p==='email'&&!email){S.authError='Digite um e-mail válido.';draw();return}
if(p==='email'&&!password){S.authError='Digite sua senha.';draw();return}
S.authBusy=true;S.authError='';S.authOk='';draw();
try{
if(p==='email')await FB.email(email,password);
else await FB.google();
}catch(e){S.authBusy=false;S.authError=authErrorMessage(e,'login');draw()}
}
async function createAccount(){
if(!window.FB){S.authError='O Firebase não está disponível neste ambiente.';draw();return}
const name=($('#auth-name')?.value||'').trim(),email=($('#auth-email')?.value||'').trim().toLowerCase(),p1=$('#auth-password')?.value||'',p2=$('#auth-password2')?.value||'';S.authEmail=email;S.authError='';S.authOk='';
if(!email)return void(S.authError='Digite seu e-mail.',draw());if(!p1)return void(S.authError='Digite uma senha.',draw());if(p1.length<6)return void(S.authError='A senha precisa ter pelo menos 6 caracteres.',draw());if(p1!==p2)return void(S.authError='As senhas não coincidem.',draw());
S.authBusy=true;draw();try{const u=await FB.signup(email,p1);if(name)await FB.profile(name);finishAuth(FB.user()||u)}catch(e){S.authBusy=false;S.authError=authErrorMessage(e,'signup');draw()}
}
async function resetPassword(){
if(!window.FB){S.authError='O Firebase não está disponível neste ambiente.';draw();return}
const email=($('#auth-email')?.value||'').trim().toLowerCase();S.authEmail=email;S.authError='';S.authOk='';if(!email)return void(S.authError='Digite seu e-mail.',draw());
S.authBusy=true;draw();try{await FB.reset(email);S.authBusy=false;S.authOk='Se houver uma conta associada a este e-mail, enviamos as instruções para redefinir sua senha.';draw()}catch(e){S.authBusy=false;S.authError=authErrorMessage(e,'reset');draw()}
}
