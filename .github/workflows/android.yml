name: Android build
on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        run: gradle :android:app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: atlas-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk_path="$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$apk_path"
          gh release create "apk-${GITHUB_RUN_ID}" "$apk_path#atlas-debug.apk" \
            --target "$GITHUB_SHA" \
            --title "ATLAS debug APK #${GITHUB_RUN_NUMBER}" \
            --notes "Debug-signed APK for testing. Not for production distribution."
